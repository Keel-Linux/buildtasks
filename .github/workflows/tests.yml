# Coverage gate for buildtasks. Threshold 0: nothing is measured on 19.x
# (tests/ holds the appname-version and signature scripts, no coverage run).
# tests/layer arrives with feat/bt-layer; raise the threshold when it merges.
name: tests
on:
  pull_request:
  push:
    branches: [19.x]
jobs:
  tests:
    uses: keel-linux/.github/.github/workflows/test-shell.yml@main
    with:
      threshold: 0
